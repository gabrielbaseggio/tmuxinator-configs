name: w-mics
root: ~/dev/projects

on_project_stop: |
  docker compose -f w-mics-backend/docker-compose.yml down
  docker compose -f w-mics/docker-compose.yml         down

windows:
  - dev:
      layout: even-horizontal
      panes:
        - claude
        - # bash
  - servers:
      layout: even-horizontal
      panes:
        - docker compose -f w-mics/docker-compose.yml         up
        - docker compose -f w-mics-backend/docker-compose.yml up
